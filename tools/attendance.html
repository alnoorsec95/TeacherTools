<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كشف حضور الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f8f4;--ink:#0f2d28;--mut:#5b7a74;--card:#fff;--line:#dbe8e2;--teal:#0f766e;--teal2:#0a4f49;--gold:#ffc93c;--or:#f97316;
--p:#16a34a;--a:#e11d48;--t:#f59e0b;--e:#3b82f6;--o:#94a3b8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Readex Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.hero{background:linear-gradient(135deg,#0a4f49,#0f766e 60%,#14958a);color:#fff;padding:26px 16px 70px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.hero::before{width:260px;height:260px;top:-90px;left:-60px}.hero::after{width:180px;height:180px;bottom:-80px;right:8%}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px;position:relative}
.hero .wrap{padding:0}
.back{color:#c9f5ee;text-decoration:none;font-size:13px;display:inline-flex;gap:6px;align-items:center;opacity:.9}
.back:hover{opacity:1}
h1{font-family:Lalezar,cursive;font-weight:400;font-size:clamp(30px,6vw,46px);margin:8px 0 2px;display:flex;gap:12px;align-items:center}
h1 .em{display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.hero p{margin:0;color:#d7f7f1;font-size:15px}
main{margin-top:-46px;padding-bottom:50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(15,45,40,.08);margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.num{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:inline-grid;place-items:center;font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.chip:hover{border-color:var(--teal);transform:translateY(-2px)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 6px 14px rgba(15,118,110,.3)}
.chip .x{opacity:.55;font-size:12px;padding:0 2px}.chip .x:hover{opacity:1;color:var(--a)}.chip.on .x:hover{color:#ffd1d9}
.chip.add{border-style:dashed;color:var(--teal);font-weight:600}
.chip.sm{padding:4px 11px;font-size:13px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut);font-weight:500}
.in{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;font-size:15px;color:var(--ink);width:100%;outline:none;transition:.2s}
.in:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.btn{border:0;border-radius:12px;padding:10px 18px;background:var(--teal);color:#fff;font-weight:600;cursor:pointer;transition:.2s;font-size:14px}
.btn:hover{background:var(--teal2);transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.btn.ghost:hover{background:#e9f7f4}
.btn.or{background:var(--or)}.btn.or:hover{background:#ea580c}
.hide{display:none!important}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.err{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:14px;padding:12px 14px;font-size:14px;margin-top:12px}
.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:14px;padding:9px 14px;font-size:13px;margin-top:12px}
details{margin-top:12px;font-size:13.5px;color:var(--mut)}summary{cursor:pointer;color:var(--teal);font-weight:600}
details ol{margin:8px 0 0;padding-inline-start:22px}
.addbox{margin-top:14px;padding:14px;border-radius:16px;background:#f3faf8;border:1px dashed #9fd3cb}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #b7e0da;border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:4px 0 14px}
.tile{border-radius:16px;padding:12px 14px;color:#fff;position:relative;overflow:hidden;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.tile b{display:block;font-size:28px;font-family:Lalezar;line-height:1.1;font-weight:400}
.tile span{font-size:13px;opacity:.95}
.tile i{position:absolute;left:8px;top:4px;font-style:normal;font-size:30px;opacity:.25}
.tile.p{background:linear-gradient(135deg,#16a34a,#4ade80)}.tile.a{background:linear-gradient(135deg,#e11d48,#fb7185)}
.tile.t{background:linear-gradient(135deg,#f59e0b,#fcd34d);color:#4a3000}.tile.e{background:linear-gradient(135deg,#3b82f6,#7dd3fc)}
.tile.r{background:linear-gradient(135deg,#0f766e,#2dd4bf)}.tile.d{background:linear-gradient(135deg,#64748b,#94a3b8)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mo{margin:12px 0}.mo h3{margin:0 0 8px;font-size:14px;color:var(--teal)}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{width:62px;border-radius:14px;padding:6px 4px;text-align:center;color:#fff;font-size:12px;animation:pop .4s both}
.day b{display:block;font-size:20px;font-family:Lalezar;font-weight:400;line-height:1.2}
.day.p{background:var(--p)}.day.a{background:var(--a)}.day.t{background:var(--t);color:#4a3000}.day.e{background:var(--e)}.day.o{background:var(--o)}
.day small{display:block;font-size:11px;opacity:.9}
.tw{overflow:auto;border:1px solid var(--line);border-radius:16px;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid #edf3f0;white-space:nowrap}
th{background:#eef7f4;position:sticky;top:0;z-index:2;color:var(--teal2);cursor:pointer;user-select:none}
td.nm,th.nm{text-align:right;position:sticky;right:0;background:inherit;z-index:1;font-weight:600}
td.nm{background:#fff}th.nm{z-index:3}
tbody tr:hover td{background:#f4fbf9}tr.go{cursor:pointer}
.cp{color:var(--p);font-weight:700}.ca{color:var(--a);font-weight:700}.ct{color:#b45309;font-weight:700}.ce{color:var(--e);font-weight:700}
.bar{height:9px;background:#e8f0ed;border-radius:99px;min-width:80px;overflow:hidden;display:inline-block;width:90px;vertical-align:middle}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f43f5e,#f59e0b,#22c55e);background-size:90px 100%;border-radius:99px}
.cell{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;color:#fff;font-size:12px;font-weight:700}
.cell.p{background:var(--p)}.cell.a{background:var(--a)}.cell.t{background:var(--t)}.cell.e{background:var(--e)}.cell.o{background:var(--o)}
.mx th,.mx td{padding:5px 4px;font-size:12px}.mx th small{display:block;font-weight:400;opacity:.7}
.abs{margin-top:12px;padding:12px 14px;background:#fff7f8;border:1px solid #fecdd3;border-radius:14px;font-size:14px}
.abs b{color:var(--a)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;align-items:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:10px}
.legend .cell{width:16px;height:16px;border-radius:5px;vertical-align:-3px;margin-inline-end:4px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:9;font-size:14px}
.toast.on{opacity:1;transform:translateX(-50%)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:6px}
.cc{border-radius:20px;padding:16px 14px 14px;text-align:center;border:1.5px solid var(--line);background:#fff;transition:.25s;animation:pop .45s both;position:relative;overflow:hidden}
.cc::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--lc,#0f766e)}
.cc:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 14px 28px rgba(15,45,40,.15);border-color:var(--lc)}
.cc .em{font-size:34px;display:block;margin-bottom:2px}
.cc .cn{font-family:'Readex Pro',system-ui,sans-serif;font-weight:700;font-size:30px;line-height:1.3;color:var(--lc);padding-top:6px;letter-spacing:.5px}
.cc .cl{font-size:13px;color:var(--mut);margin:2px 0 12px}
.cc .btn{width:100%;background:var(--lc)}
.cc .btn[disabled]{background:#cbd5d1;cursor:not-allowed;transform:none;font-size:13px}
.lv1{--lc:#0f766e}.lv2{--lc:#7c3aed}.lv3{--lc:#ea580c}.lv0{--lc:#64748b}
.vt{font-family:'Readex Pro',system-ui,sans-serif;font-weight:700;font-size:22px;color:var(--teal2)}
.tw table{font-size:17px}.tw th{font-size:15.5px;padding:13px 12px}.tw td{padding:12px}
td.nm{font-size:17px}
.mx th,.mx td{padding:8px 6px;font-size:15px}.mx th small{font-size:12px;opacity:.85}
.cell{width:34px;height:34px;font-size:16px;border-radius:10px}
.legend{font-size:15px}.legend .cell{width:20px;height:20px;border-radius:6px}
.bar{height:12px;width:110px}.bar i{background-size:110px 100%}
.day{width:78px;padding:8px 4px}.day b{font-size:26px}.day small{font-size:13px}
.mo h3{font-size:17px}.abs{font-size:16px;line-height:1.9}
.tile span{font-size:14.5px}.tile b{font-size:32px}
.num+*{}

/* ===== effects ===== */
.hero{background:linear-gradient(120deg,#0a4f49,#0f766e,#14b8a6,#0f766e,#0a4f49);background-size:300% 300%;animation:hg 14s ease-in-out infinite}
@keyframes hg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.bub{position:absolute;bottom:-70px;left:var(--l);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 60%);border:1px solid rgba(255,255,255,.25);animation:rise var(--d) linear var(--dl) infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0) translateX(0) scale(.8);opacity:0}15%{opacity:.9}100%{transform:translateY(-330px) translateX(24px) scale(1.15);opacity:0}}
h1{background:linear-gradient(90deg,#fff,#ffe58a,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite}
h1 .em{-webkit-text-fill-color:initial}
@keyframes shine{to{background-position:-200% 0}}
.card{animation:cardin .6s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.98)}}
.num{background:linear-gradient(135deg,#0f766e,#34d399);box-shadow:0 4px 10px rgba(15,118,110,.35);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.chip.on{background:linear-gradient(120deg,#0f766e,#14b8a6,#0f766e);background-size:200% 100%;animation:sh2 3s linear infinite}
@keyframes sh2{to{background-position:-200% 0}}
.chip{position:relative;overflow:hidden}.chip:active{transform:scale(.94)}
/* class cards */
.cc{--lc2:#94a3b8;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .3s,border-color .3s;will-change:transform;background:#fff}
.cc:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-8px) scale(1.03);box-shadow:0 18px 36px -8px var(--lc),0 0 0 1.5px var(--lc);border-color:var(--lc)}
.cc::before{height:8px;background:linear-gradient(90deg,var(--lc),var(--lc2),var(--lc));background-size:200% 100%;animation:sh2 4s linear infinite}
.cc::after{content:"";position:absolute;inset:0;background:radial-gradient(180px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--lc2) 28%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.cc:hover::after{opacity:1}
.cc .cn{background:linear-gradient(120deg,var(--lc),var(--lc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;transition:transform .3s}
.cc:hover .cn{transform:scale(1.12)}
.cc .btn{background:linear-gradient(120deg,var(--lc),var(--lc2),var(--lc));background-size:220% 100%;position:relative;overflow:hidden;box-shadow:0 8px 16px -6px var(--lc);transition:background-position .6s,transform .2s,box-shadow .3s}
.cc .btn:hover{background-position:100% 0;box-shadow:0 12px 22px -6px var(--lc)}
.cc .btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite}
.cc .btn[disabled]{background:#cbd5d1;box-shadow:none}.cc .btn[disabled]::after{display:none}
@keyframes sweep{0%,55%{left:-70%}100%{left:130%}}
/* report */
.tile::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sweep 4.5s ease-in-out infinite}
.tile:hover{transform:translateY(-4px) scale(1.04);transition:.2s}
.tile i{animation:bob 3s ease-in-out infinite}
tbody tr{animation:rowin .45s ease both}
@keyframes rowin{from{opacity:0;transform:translateX(18px)}}
.mx tbody tr:nth-child(1),tbody tr:nth-child(1){animation-delay:35ms}
.mx tbody tr:nth-child(2),tbody tr:nth-child(2){animation-delay:70ms}
.mx tbody tr:nth-child(3),tbody tr:nth-child(3){animation-delay:105ms}
.mx tbody tr:nth-child(4),tbody tr:nth-child(4){animation-delay:140ms}
.mx tbody tr:nth-child(5),tbody tr:nth-child(5){animation-delay:175ms}
.mx tbody tr:nth-child(6),tbody tr:nth-child(6){animation-delay:210ms}
.mx tbody tr:nth-child(7),tbody tr:nth-child(7){animation-delay:245ms}
.mx tbody tr:nth-child(8),tbody tr:nth-child(8){animation-delay:280ms}
.mx tbody tr:nth-child(9),tbody tr:nth-child(9){animation-delay:315ms}
.mx tbody tr:nth-child(10),tbody tr:nth-child(10){animation-delay:350ms}
.mx tbody tr:nth-child(11),tbody tr:nth-child(11){animation-delay:385ms}
.mx tbody tr:nth-child(12),tbody tr:nth-child(12){animation-delay:420ms}
.mx tbody tr:nth-child(13),tbody tr:nth-child(13){animation-delay:455ms}
.mx tbody tr:nth-child(14),tbody tr:nth-child(14){animation-delay:490ms}
.bar i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.cell{transition:transform .2s}.cell:hover{transform:scale(1.35) rotate(-6deg);position:relative;z-index:3}
.day{transition:transform .2s}.day:hover{transform:translateY(-5px) rotate(-3deg) scale(1.08)}
.btn{position:relative;overflow:hidden}
.btn:not(.ghost):not([disabled])::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:not(.ghost):not([disabled]):hover::after{left:130%}
.btn:not(.ghost):not(.cc .btn){background:linear-gradient(120deg,#0f766e,#14958a)}
@media print{.hero,.noprint,.toolbar,.addbox,details{display:none!important}body{background:#fff}main{margin:0}.card{box-shadow:none;break-inside:avoid}.tw{max-height:none;overflow:visible}.print-h{display:block!important}}
.print-h{display:none;font-family:Lalezar;font-size:22px;margin-bottom:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="hero noprint">
  <span class="bub" style="--l:6%;--s:46px;--d:9s;--dl:0s"></span><span class="bub" style="--l:22%;--s:22px;--d:7s;--dl:-2s"></span><span class="bub" style="--l:41%;--s:34px;--d:11s;--dl:-5s"></span><span class="bub" style="--l:63%;--s:18px;--d:8s;--dl:-1s"></span><span class="bub" style="--l:78%;--s:52px;--d:12s;--dl:-6s"></span><span class="bub" style="--l:92%;--s:26px;--d:9.5s;--dl:-3s"></span>
  <div class="wrap">
    <a class="back" href="javascript:history.length>1?history.back():window.close()">→ العودة إلى ركن المعلم</a>
    <h1><span class="em">📋</span> كشف حضور الطلاب</h1>
    <p>اختر الصف والطالب والفترة، ويظهر لك الحضور والغياب فوراً ✨</p>
  </div>
</header>
<main class="wrap">

<section class="card noprint" id="pick">
  <h2><span class="num">١</span> اختر طريقة العرض</h2>
  <div class="chips" id="modes" style="margin-bottom:14px"></div>
  <div id="clsUI">
  <div class="toolbar">
    <input class="in" id="qc" type="search" placeholder="🔍 ابحث عن صف… (مثال: 5كيم2)" style="max-width:320px" autocomplete="off">
    <div class="chips" id="lv"></div>
  </div>
  <div class="cgrid" id="cgrid"></div>
  <div class="note"><button class="chip sm add" data-act="demo">✨ شاهد مثالاً ببيانات تجريبية</button></div>
  </div>
  <div id="tchUI" class="hide">
    <div class="note" id="tProg" style="margin:0 0 12px"></div>
    <div class="row">
      <label class="f">المعلمة<select class="in" id="tT"></select></label>
      <label class="f">الصف<select class="in" id="tC"></select></label>
      <label class="f" id="tSL">اسم الطالبة (اختياري)<input class="in" id="tS" type="search" placeholder="اكتب جزءاً من الاسم" autocomplete="off"></label>
      <label class="f hide" id="tSSL">الطالبة<select class="in" id="tSS"></select></label>
      <label class="f">من تاريخ<input class="in" type="date" id="tF"></label>
      <label class="f">إلى تاريخ<input class="in" type="date" id="tD"></label>
    </div>
    <label style="display:inline-flex;gap:8px;align-items:center;margin:12px 0;font-size:15px;cursor:pointer"><input type="checkbox" id="tA" style="width:18px;height:18px"> أظهر الحضور أيضاً (الافتراضي: الغياب والتأخر فقط)</label>
    <div id="tRes"></div>
  </div>
</section>

<div id="view" class="hide">
  <div class="toolbar noprint"><button class="btn ghost" data-act="back">→ العودة إلى الصفوف</button><span class="vt" id="vt"></span></div>
  <div id="status"></div>
<section class="card noprint hide" id="filters">
  <h2><span class="num">٢</span> الطالب والفترة</h2>
  <div class="row">
    <label class="f">المعلمة التي سجّلت الغياب<select class="in" id="fTch"></select></label>
    <label class="f">الطالب / الطالبة<select class="in" id="fStu"></select></label>
    <label class="f">من تاريخ<input class="in" type="date" id="fFrom"></label>
    <label class="f">إلى تاريخ<input class="in" type="date" id="fTo"></label>
  </div>
  <div class="chips" id="months" style="margin-top:12px"></div>
  <div id="monthFix" class="note hide"></div>
</section>

<section class="card hide" id="report">
  <div class="print-h" id="printH"></div>
  <h2 class="noprint"><span class="num">٣</span> الكشف</h2>
  <div id="rep"></div>
</section>
</div>
</main>
<input type="file" id="upF" accept=".xlsx,.xls,.csv" hidden>
<div class="toast" id="toast"></div>

<script>
var $=function(s){return document.querySelector(s)};
var same=function(a,b){return norm(a)==norm(b)};
var AR=function(s){return String(s).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})};
var EN=function(s){return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})};

    return '<button class="chip sm'+(S.from==a&&S.to==b?' on':'')+'" data-act="month" data-a="'+a+'" data-b="'+b+'">📅 '+MN[m-1]+' '+AR(y)+'</button>'}).join('');
  var mf=$('#monthFix');
  if(d.dayMode){mf.classList.remove('hide');var o=c.opts;mf.innerHTML='الشيت يحتوي أرقام الأيام فقط، فحدّد شهره: <select class="in" style="width:auto;display:inline" id="oM">'+MN.map(function(n,i){return '<option value="'+(i+1)+'"'+(o.m==i+1?' selected':'')+'>'+n+'</option>'}).join('')+'</select> <input class="in" style="width:90px;display:inline" type="number" id="oY" value="'+o.y+'">'}
  else if(d.ambiguous){mf.classList.remove('hide');mf.innerHTML='ترتيب التاريخ في الشيت (مثل ١٠/٨/٢٠٢٦): <select class="in" style="width:auto;display:inline" id="oO"><option value="dm"'+(d.ord!='md'?' selected':'')+'>يوم / شهر</option><option value="md"'+(d.ord=='md'?' selected':'')+'>شهر / يوم</option></select>'}
  else mf.classList.add('hide');
  $('#printH').textContent='كشف حضور — '+c.name;
  var _h=S.stu?oneView(c,S.stu):allView(c);if($('#rep').dataset.h!=_h){$('#rep').innerHTML=_h;$('#rep').dataset.h=_h;countUp($('#rep'))}
}
function tiles(t){
  var u=U();
  return '<div class="sumgrid">'+
  '<div class="tile r"><i>📈</i><b>'+AR(t.pct)+'٪</b><span>نسبة الحضور</span></div>'+
  '<div class="tile p"><i>✅</i><b>'+AR(t.p)+'</b><span>'+(u=='حصة'?'حصص الحضور':'أيام الحضور')+'</span></div>'+
  '<div class="tile a"><i>❌</i><b>'+AR(t.a)+'</b><span>'+(u=='حصة'?'حصص الغياب':'أيام الغياب')+'</span></div>'+
  '<div class="tile t"><i>⏰</i><b>'+AR(t.t)+'</b><span>التأخر</span></div>'+
  '<div class="tile e"><i>📝</i><b>'+AR(t.e)+'</b><span>غياب بعذر</span></div>'+
  '<div class="tile d"><i>🗓️</i><b>'+AR(t.ad)+'</b><span>أيام فيها غياب</span></div></div>';
}
function legend(){return '<div class="legend"><span><i class="cell p"></i>حاضر</span><span><i class="cell a"></i>غائب</span><span><i class="cell t"></i>متأخر</span><span><i class="cell e"></i>بعذر</span></div>'}
function oneView(c,n){
  var t=stats(c.data.students[n]);
  if(!t.days.length)return '<div class="empty">لا توجد سجلات لهذا الطالب في الفترة المختارة 🔍</div>';
  var h='<h3 style="margin:0 0 8px;font-size:20px">👩‍🎓 '+esc(n)+'</h3>'+tiles(t);
  var g={};t.days.forEach(function(x){(g[x[0].slice(0,7)]=g[x[0].slice(0,7)]||[]).push(x)});
  Object.keys(g).sort().forEach(function(k){
    h+='<div class="mo"><h3>'+MN[+k.slice(5)-1]+' '+AR(k.slice(0,4))+'</h3><div class="days">'+g[k].map(function(x,i){
      var dt=new Date(x[0]+'T00:00:00');
      var bad=x[2].filter(function(y){return y[1]!='p'&&y[0]}).map(function(y){return y[0].replace(/^ال/,'')}),sub=x[1]=='p'?NAMES.p:(bad.length?NAMES[x[1]]+' '+bad.join('، '):NAMES[x[1]]);
      return '<div class="day '+x[1]+'" style="animation-delay:'+i*25+'ms" title="'+fmt(x[0],true)+' — '+x[2].map(function(y){return (y[0]?y[0]+': ':'')+NAMES[y[1]]}).join(' | ')+'"><small>'+WS[dt.getDay()]+'</small><b>'+AR(dt.getDate())+'</b><small>'+esc(sub)+'</small></div>'}).join('')+'</div></div>';
  });
  var ab=t.days.filter(function(x){return x[1]=='a'||x[1]=='e'});
  h+='<div class="abs">'+(ab.length?'<b>أيام الغياب ('+AR(ab.length)+'):</b> '+ab.map(function(x){return fmt(x[0])+perTxt(x[2],['a','e'])+(x[1]=='e'?' (بعذر)':'')}).join('، '):'🌟 <b style="color:var(--p)">لا توجد أي أيام غياب في هذه الفترة، أحسنتِ!</b>')+'</div>';
  h+='<div class="toolbar noprint" style="margin-top:12px"><button class="btn ghost" data-act="copy">📋 نسخ ملخص الطالب</button><button class="btn ghost" data-act="print">🖨️ طباعة</button></div>'+legend();
  return h;
}
function allView(c){
  var rows=Object.keys(c.data.students).map(function(n){return{n:n,t:stats(c.data.students[n])}}).filter(function(r){return r.t.days.length});
  if(!rows.length)return '<div class="empty">لا توجد سجلات في الفترة المختارة 🔍</div>';
  var tot={p:0,a:0,t:0,e:0,n:0,ad:0};rows.forEach(function(r){['p','a','t','e','n','ad'].forEach(function(k){tot[k]+=r.t[k]})});
  tot.pct=tot.n?Math.round((tot.p+tot.t)/tot.n*100):0;
  var k=S.sort,dir=S.dir;
  rows.sort(function(a,b){return k=='name'?dir*a.n.localeCompare(b.n,'ar'):dir*((a.t[k]-b.t[k])||a.n.localeCompare(b.n,'ar'))});
  var arr=function(x){return S.sort==x?(S.dir>0?' ▲':' ▼'):''};
  var h=tiles(tot)+'<div class="toolbar noprint"><button class="chip sm'+(S.view=='sum'?' on':'')+'" data-act="view" data-v="sum">📊 ملخص الطلاب</button><button class="chip sm'+(S.view=='mx'?' on':'')+'" data-act="view" data-v="mx">🗓️ جدول الأيام</button><button class="chip sm" data-act="print">🖨️ طباعة</button><span class="note" style="margin:0">اضغط اسم الطالب لعرض كشفه</span></div>';
  if(S.view=='sum'){
    h+='<div class="tw"><table><thead><tr><th class="nm" data-act="sort" data-k="name">الطالب'+arr('name')+'</th><th data-act="sort" data-k="p">حاضر'+arr('p')+'</th><th data-act="sort" data-k="t">متأخر'+arr('t')+'</th><th data-act="sort" data-k="a">غائب'+arr('a')+'</th><th data-act="sort" data-k="e">بعذر'+arr('e')+'</th><th data-act="sort" data-k="ad">أيام فيها غياب'+arr('ad')+'</th><th data-act="sort" data-k="pct">نسبة الحضور'+arr('pct')+'</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr class="go" data-act="stu" data-n="'+esc(r.n)+'"><td class="nm">'+esc(r.n)+'</td><td class="cp">'+AR(r.t.p)+'</td><td class="ct">'+AR(r.t.t)+'</td><td class="ca">'+AR(r.t.a)+'</td><td class="ce">'+AR(r.t.e)+'</td><td class="ca">'+AR(r.t.ad)+'</td><td><span class="bar"><i style="width:'+r.t.pct+'%"></i></span> '+AR(r.t.pct)+'٪</td></tr>'}).join('')+'</tbody></table></div>';
  }else{
    var ds=c.data.dates.filter(function(d){return inRange(d)&&rows.some(function(r){return r.t.days.some(function(x){return x[0]==d})})});
    h+='<div class="tw"><table class="mx"><thead><tr><th class="nm">الطالب</th>'+ds.map(function(d){var x=new Date(d+'T00:00:00');return '<th style="cursor:default">'+AR(x.getDate())+'<small>'+WS[x.getDay()]+'</small></th>'}).join('')+'<th style="cursor:default">غ</th></tr></thead><tbody>'+
    rows.map(function(r){var rec=Object.keys(c.data.students[r.n]).reduce(function(o,k){o[k]=c.data.students[r.n][k].filter(function(x){return !S.tch||same(x[2],S.tch)});return o},{});return '<tr class="go" data-act="stu" data-n="'+esc(r.n)+'"><td class="nm">'+esc(r.n)+'</td>'+ds.map(function(d){var en=rec[d],w=null;if(en&&en.length){w='o';en.forEach(function(y){w=worse(w,y[1])})}return '<td>'+(w?'<span class="cell '+w+'" title="'+esc(en.map(function(y){return (y[0]?y[0]+': ':'')+NAMES[y[1]]}).join(' | '))+'">'+LET[w]+'</span>':'')+'</td>'}).join('')+'<td class="ca">'+AR(r.t.ad)+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  return h+legend();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),c=cur();
  if(a=='del'){e.stopPropagation();var id=el.getAttribute('data-id');classes=classes.filter(function(x){return x.id!=id});if(S.cid==id)S.cid=null;saveList();render();return}
  if(a=='pick'||a=='open')pick(el.getAttribute('data-id'));
  else if(a=='upload'){S.upId=el.getAttribute('data-id');$('#upF').click()}
  else if(a=='retry'){var rc=classes.filter(function(x){return x.id==el.getAttribute('data-id')})[0];if(rc){rc.err='';rc.data=null;loadClass(rc)}}
  else if(a=='back'){S.cid=null;S.stu='';S.tch='';render();window.scrollTo(0,0)}
  else if(a=='mode'){S.mode=el.getAttribute('data-v');renderPick();if(S.mode=='tch')updateT()}
  else if(a=='lv'){S.lv=+el.getAttribute('data-v');renderPick()}
  else if(a=='add'){$('#addbox').classList.toggle('hide')}
  else if(a=='cancel')$('#addbox').classList.add('hide');
  else if(a=='link'){
    var nm=$('#aName').value.trim(),u=$('#aUrl').value.trim();
    if(!nm||!u){toast('اكتب اسم الصف والرابط ✍️');return}
    if(!csvUrl(u)){toast('الرابط غير صحيح');return}
    var n={id:'c'+Date.now(),name:nm,url:u};classes.push(n);saveList();$('#addbox').classList.add('hide');$('#aName').value=$('#aUrl').value='';pick(n.id);
  }
  else if(a=='demo'){
    var d={id:'demo',name:'تجريبي ١-أ',sheets:[demoRows()]};
    classes=classes.filter(function(x){return x.id!='demo'});classes.push(d);S.cid='demo';
    try{finish(d)}catch(er){}render();
  }
  else if(a=='all'){S.from=c.data.dates[0];S.to=c.data.dates[c.data.dates.length-1];render()}
  else if(a=='month'){S.from=el.getAttribute('data-a');S.to=el.getAttribute('data-b');render()}
  else if(a=='view'){S.view=el.getAttribute('data-v');render()}
  else if(a=='sort'){var k=el.getAttribute('data-k');if(S.sort==k)S.dir*=-1;else{S.sort=k;S.dir=k=='name'?1:-1}render()}
  else if(a=='stu'){S.stu=el.getAttribute('data-n');$('#fStu').value=S.stu;render();$('#report').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a=='print'){try{window.print()}catch(er){toast('الطباعة غير متاحة هنا')}}
  else if(a=='copy'){
    var t=stats(c.data.students[S.stu]),ab=t.days.filter(function(x){return x[1]=='a'||x[1]=='e'});
    var tx='تقرير حضور: '+S.stu+' ('+c.name+')\nالفترة: '+fmt(S.from,true)+' إلى '+fmt(S.to,true)+'\nمسجّل: '+AR(t.n)+' '+U()+' | حاضر: '+AR(t.p)+' | متأخر: '+AR(t.t)+' | غائب: '+AR(t.a)+' | بعذر: '+AR(t.e)+'\nنسبة الحضور: '+AR(t.pct)+'٪'+(ab.length?'\nأيام الغياب: '+ab.map(function(x){return fmt(x[0])+perTxt(x[2],['a','e'])}).join('، '):'\nلا توجد أيام غياب');
    var ok=function(){toast('تم نسخ الملخص 📋')};
    var fb=function(){var ta=document.createElement('textarea');ta.value=tx;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(er){toast('تعذر النسخ')}ta.remove()};
    try{navigator.clipboard.writeText(tx).then(ok,fb)}catch(er){fb()}
  }
});
document.addEventListener('input',function(e){if(e.target.id=='qc'){S.q=e.target.value;renderPick()}else if(e.target.id=='tS'){T.q=e.target.value;updateT()}});
document.addEventListener('change',function(e){
  var id=e.target.id,c=cur();
  if(id=='tT'){T.tch=e.target.value;updateT()}
  else if(id=='tC'){T.cls=e.target.value;T.fOn=false;T.q='';$('#tS').value='';if(T.cls=='*')loadAll();else if(T.cls!='none'){var cc=classes.filter(function(c){return c.id==T.cls})[0];if(cc&&!cc.data&&!cc.loading){cc.tried=true;loadClass(cc)}}updateT()}
  else if(id=='tF'){T.from=e.target.value||T.from;updateT()}
  else if(id=='tD'){T.to=e.target.value||T.to;updateT()}
  else if(id=='tSS'){T.q=e.target.value;updateT()}
  else if(id=='tA'){T.all=e.target.checked;updateT()}
  else if(id=='fStu'){S.stu=e.target.value;render()}
  else if(id=='fTch'){S.tch=e.target.value;render()}
  else if(id=='fFrom'){S.from=e.target.value||c.data.dates[0];if(S.to<S.from)S.to=S.from;render()}
  else if(id=='fTo'){S.to=e.target.value||c.data.dates[c.data.dates.length-1];if(S.to<S.from)S.from=S.to;render()}
  else if(id=='oO'){c.opts.ord=e.target.value;try{finish(c);S.from=c.data.dates[0];S.to=c.data.dates[c.data.dates.length-1]}catch(er){}render()}
  else if(id=='oM'||id=='oY'){c.opts={m:+$('#oM').value,y:+$('#oY').value||c.opts.y,ord:c.opts.ord};try{finish(c);S.from=c.data.dates[0];S.to=c.data.dates[c.data.dates.length-1]}catch(er){}render()}
  else if(id=='upF'){
    var f=e.target.files[0],c=classes.filter(function(x){return x.id==S.upId})[0];if(!f||!c)return;
    var rd=new FileReader(),isCsv=/\.csv$/i.test(f.name);
    rd.onload=function(){
      try{
        if(isCsv)c.sheets=[csv(String(rd.result))];
        else{var wb=XLSX.read(rd.result,{type:'array'});c.sheets=wb.SheetNames.map(function(sn){return XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:'',dateNF:'yyyy-mm-dd'})})}
        c.err='';c.data=null;c.opts=null;try{finish(c)}catch(er){c.err='shape'}
        if(S.mode=='tch'&&!S.cid)T.fOn=false;
      }catch(er){toast('تعذّرت قراءة الملف')}
      e.target.value='';render();
    };
    if(isCsv)rd.readAsText(f);else rd.readAsArrayBuffer(f);
  }
});

/* ---------- effects ---------- */
document.addEventListener('pointermove',function(e){
  var c=e.target.closest&&e.target.closest('.cc');if(!c)return;
  var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  c.style.setProperty('--rx',((.5-y)*12).toFixed(1)+'deg');c.style.setProperty('--ry',((x-.5)*14).toFixed(1)+'deg');
  c.style.setProperty('--mx',(x*100).toFixed(0)+'%');c.style.setProperty('--my',(y*100).toFixed(0)+'%');
});
document.addEventListener('pointerout',function(e){var c=e.target.closest&&e.target.closest('.cc');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
function countUp(root){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  [].forEach.call(root.querySelectorAll('.tile b'),function(b){
    var t=b.textContent,n=+EN(t).replace(/[^\d]/g,''),suf=/٪|%/.test(t)?'٪':'';
    if(!n)return;var t0=performance.now();
    (function f(now){var k=Math.min(1,(now-t0)/800),v=Math.round(n*(1-Math.pow(1-k,3)));b.textContent=AR(v)+suf;if(k<1)requestAnimationFrame(f)})(t0);
  });
}
render();
</script>
</body>
</html>
